server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # CORS sirf yahan - frontend (3000) se gateway (8080) tak
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Routes - gateway incoming request dekh ke sahi service pe bhejta hai
      routes:

        # Auth Service (8081) - /auth/** wale requests
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # Flight Service (8082) - /flights/** wale requests
        - id: flight-service
          uri: http://localhost:8082
          predicates:
            - Path=/flights/**

        # Booking Service (8083) - /bookings/** wale requests
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/bookings/**

        # Passenger Service (8084) - /passengers/** wale requests
        - id: passenger-service
          uri: http://localhost:8084
          predicates:
            - Path=/passengers/**

        # Payment Service (8085) - /payments/** wale requests
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**

        # Seat Service (8086) - /seats/** wale requests
        - id: seat-service
          uri: http://localhost:8086
          predicates:
            - Path=/seats/**

        # Airline Service (8087) - /airlines/** aur /airports/** wale requests
        - id: airline-service
          uri: http://localhost:8087
          predicates:
            - Path=/airlines/**,/airports/**

# Health check endpoint
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
